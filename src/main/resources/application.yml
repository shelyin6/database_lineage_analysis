server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: sql-metadata-viewer
  # 静态资源（index.html / app.js / styles.css）不打浏览器缓存：
  # 内网反复升级时，浏览器若沿用旧缓存会出现"界面没变化"的假象。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true

metadata:
  annotation-database: metadata.sqlite
  # 二期只读数据库接入（Inceptor），默认关闭；开启示例见 application-example.yml
  # inceptor:
  #   enabled: false
  #   url: jdbc:inceptor2://10.0.0.9:10000/system
